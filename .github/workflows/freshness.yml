name: check-freshness

# Fails (and so triggers GitHub's failed-workflow email) when today's collection is missing,
# whether the collector failed or GitHub never started it. Runs late in the day to leave
# room for the collector's known schedule delays. Same secret and variables as collect.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check today's data exists
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.check_freshness
