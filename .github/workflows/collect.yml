name: collect-fuel-prices

# Daily snapshot at 06:01 UTC. Needs the GCP_SA_KEY secret and the GCP_PROJECT / BQ_DATASET
# variables (Settings > Secrets and variables > Actions). Can also be run by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "1 6 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.collect
