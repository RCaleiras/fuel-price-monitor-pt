name: collect-fuel-prices

# Daily snapshot at 06:01 UTC. Needs the GCP_SA_KEY secret and the GCP_PROJECT / BQ_DATASET
# variables (Settings > Secrets and variables > Actions). Can also be run by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "1 6 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.collect
      # Separate step: if it fails the day's prices are already safe in raw, and the job still turns red.
      - name: Build models
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.build_models
      # Runs every query in sql/tests/ (read-only, ~540 MiB billed, each capped); any row or error fails the job here,
      # before the export, so a snapshot that breaks a data rule is not published and the site keeps the previous day.
      - name: Run SQL tests
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.run_sql_tests
      # Writes site/data/dashboard.json from the report view; fails (and writes nothing) if a check fails,
      # so a broken snapshot is never deployed and the site keeps the previous day.
      - name: Export dashboard
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.export_dashboard --out site/data
      # Only once GitHub Pages is enabled (repo variable DASHBOARD_DEPLOY = true), so the daily run stays green before.
      - name: Upload site
        if: ${{ vars.DASHBOARD_DEPLOY == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    if: ${{ vars.DASHBOARD_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
