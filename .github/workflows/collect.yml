name: collect-fuel-prices

# Manual only for now. Enable the schedule once src/collect.py works and the
# GCP_SA_KEY secret is set (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 6 * * *"   # daily, 06:30 UTC

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python -m src.collect
